<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEC Fee Assist</title><link rel="icon" href="/nec-logo.webp"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div id="app"></div><div id="toast" role="status" aria-live="polite" hidden></div><dialog id="payment-dialog" aria-labelledby="payment-title"><form id="payment-form"><h2 id="payment-title">Demo payment</h2><p class="muted">Simulated transaction. No money transferred.</p><div id="payment-summary"></div><label for="outcome">Payment result</label><select id="outcome"><option value="completed">Complete payment</option><option value="failed">Failed payment</option><option value="cancelled">Cancelled payment</option></select><div class="dialog-actions"><button type="button" id="close-payment" class="secondary">Back</button><button type="submit" id="confirm-payment">Confirm demo payment</button></div><p id="payment-error" class="error" role="alert"></p></form></dialog></body></html>
